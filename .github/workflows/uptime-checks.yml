name: Uptime Checks

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve uptime target
        id: target
        run: |
          BASE_URL="${{ secrets.PRODUCTION_BASE_URL }}"
          if [ -z "$BASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping uptime checks: PRODUCTION_BASE_URL secret is not set."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Check main app endpoint
        if: steps.target.outputs.configured == 'true'
        run: |
          STATUS=$(curl -sS -L --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" "${{ steps.target.outputs.base_url }}/")
          echo "Main endpoint status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "Main app endpoint is unhealthy"
            exit 1
          fi

      - name: Check health endpoint
        if: steps.target.outputs.configured == 'true'
        run: |
          STATUS=$(curl -sS -L --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" "${{ steps.target.outputs.base_url }}/health")
          echo "Health endpoint status: $STATUS"
          # Accept healthy or degraded (200 or 503) as reachable, but fail on network/server errors.
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "Health endpoint check failed"
            exit 1
          fi

      - name: Uptime checks skipped (no target configured)
        if: steps.target.outputs.configured != 'true'
        run: echo "No PRODUCTION_BASE_URL configured; workflow intentionally skipped."
