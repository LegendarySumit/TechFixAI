name: Uptime Checks

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.PRODUCTION_BASE_URL }}" ]; then
            echo "PRODUCTION_BASE_URL secret not set. Skipping uptime checks."
            exit 0
          fi

      - name: Check main app endpoint
        run: |
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "${{ secrets.PRODUCTION_BASE_URL }}/")
          echo "Main endpoint status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "Main app endpoint is unhealthy"
            exit 1
          fi

      - name: Check health endpoint
        run: |
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "${{ secrets.PRODUCTION_BASE_URL }}/health")
          echo "Health endpoint status: $STATUS"
          # Accept healthy or degraded (200 or 503) as reachable, but fail on network/server errors.
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "Health endpoint check failed"
            exit 1
          fi
