name: Uptime Checks

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Normalize base URL
        id: cfg
        env:
          RAW_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: |
          BASE_URL=$(echo "$RAW_BASE_URL" | xargs)
          if [ -z "$BASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PRODUCTION_BASE_URL secret not set. Skipping uptime checks."
            exit 0
          fi

          if [[ ! "$BASE_URL" =~ ^https?:// ]]; then
            echo "Invalid PRODUCTION_BASE_URL: must start with http:// or https://"
            exit 1
          fi

          BASE_URL="${BASE_URL%/}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Validate required secrets
        if: steps.cfg.outputs.skip != 'true'
        run: |
          echo "Using base URL: ${{ steps.cfg.outputs.base_url }}"

      - name: Check main app endpoint
        if: steps.cfg.outputs.skip != 'true'
        run: |
          URL="${{ steps.cfg.outputs.base_url }}/"
          set +e
          STATUS=$(curl -sS -L --max-time 20 --retry 3 --retry-delay 2 --retry-connrefused --retry-all-errors -o /dev/null -w "%{http_code}" "$URL")
          CURL_EXIT=$?
          set -e
          echo "Main endpoint ($URL) status: $STATUS, curl_exit: $CURL_EXIT"
          # Consider any 2xx/3xx as healthy for entry route.
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "Main app endpoint is unhealthy"
            exit 1
          fi

      - name: Check health endpoint
        if: steps.cfg.outputs.skip != 'true'
        run: |
          BASE="${{ steps.cfg.outputs.base_url }}"
          CANDIDATES=("$BASE/health" "$BASE/health/" "$BASE/api/health")
          HEALTH_OK=false
          HEALTH_MISSING=false

          for URL in "${CANDIDATES[@]}"; do
            set +e
            STATUS=$(curl -sS -L --max-time 20 --retry 3 --retry-delay 2 --retry-connrefused --retry-all-errors -o /dev/null -w "%{http_code}" "$URL")
            CURL_EXIT=$?
            set -e
            echo "Health probe ($URL) status: $STATUS, curl_exit: $CURL_EXIT"

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              HEALTH_OK=true
              break
            fi

            if [ "$STATUS" = "404" ] || [ "$STATUS" = "405" ]; then
              HEALTH_MISSING=true
            fi
          done

          if [ "$HEALTH_OK" = true ]; then
            echo "Health endpoint check passed."
            exit 0
          fi

          # If the app root is healthy but health route is not exposed in this deployment, don't fail uptime.
          if [ "$HEALTH_MISSING" = true ]; then
            echo "Health endpoint not exposed (404/405) on tested paths; main endpoint is healthy. Passing with warning."
            exit 0
          fi

          echo "Health endpoint check failed on all candidate paths."
          exit 1
