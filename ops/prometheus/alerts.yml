groups:
  - name: techfixai-reliability
    interval: 30s
    rules:
      - alert: TechFixAIHigh5xxRate
        expr: |
          sum(rate(http_5xx_errors_total[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
          service: techfixai
        annotations:
          summary: "High 5xx error rate"
          description: "5xx ratio is above 5% for 5 minutes."

      - alert: TechFixAIAuthFailureSpike
        expr: sum(rate(http_auth_failures_total[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
          service: techfixai
        annotations:
          summary: "Authentication failure spike"
          description: "Auth failures are elevated for 5 minutes. Check login/signup and abuse signals."

      - alert: TechFixAIHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1.5
        for: 10m
        labels:
          severity: warning
          service: techfixai
        annotations:
          summary: "p95 latency regression"
          description: "p95 request latency is above 1.5s for 10 minutes."

      - alert: TechFixAICleanupFailures
        expr: increase(cleanup_failures_total[30m]) > 0
        for: 5m
        labels:
          severity: critical
          service: techfixai
        annotations:
          summary: "Background cleanup task failures detected"
          description: "At least one cleanup failure happened in the last 30 minutes."

      - alert: TechFixAIUploadFailureSpike
        expr: |
          sum(rate(voice_upload_failures_total[5m])) / clamp_min(sum(rate(voice_upload_total[5m])), 1) > 0.2
        for: 10m
        labels:
          severity: warning
          service: techfixai
        annotations:
          summary: "Upload failures are elevated"
          description: "Upload failure ratio is above 20% for 10 minutes."
