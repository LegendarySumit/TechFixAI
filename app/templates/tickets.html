{% extends "base.html" %}

{% block title %}Tickets - Voice-to-Ticket AI{% endblock %}

{% block content %}
<div class="page-bg-wrap">
<div class="page-bg-layer">
    <canvas id="tickets-canvas" aria-hidden="true"></canvas>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="gradient-orb orb-4"></div>
    <div class="gradient-orb orb-5"></div>
</div>
<div class="container py-4">
    <div class="mb-4">
        <h2><i class="bi bi-ticket-perforated"></i> Support Tickets</h2>
    </div>

    <!-- Filters -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <div class="position-relative">
                        <select class="form-select" id="filter-status">
                            <option value="">All Status</option>
                            <option value="open">Open</option>
                            <option value="assigned">Assigned</option>
                            <option value="in_progress">In Progress</option>
                            <option value="resolved">Resolved</option>
                        </select>
                        <i class="bi bi-chevron-down position-absolute" style="right: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: 0.6;"></i>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="position-relative">
                        <select class="form-select" id="filter-priority">
                            <option value="">All Priority</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                        <i class="bi bi-chevron-down position-absolute" style="right: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: 0.6;"></i>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="position-relative">
                        <select class="form-select" id="filter-technical-area">
                            <option value="">All Areas</option>
                            <option value="backend">Backend</option>
                            <option value="frontend">Frontend</option>
                            <option value="database">Database</option>
                            <option value="infrastructure">Infrastructure</option>
                        </select>
                        <i class="bi bi-chevron-down position-absolute" style="right: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: 0.6;"></i>
                    </div>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" onclick="loadTickets()">
                        <i class="bi bi-search"></i> Apply Filters
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tickets List -->
    <div id="tickets-container">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-2">Loading tickets...</p>
        </div>
    </div>

    <!-- Pagination -->
    <nav id="pagination-container" style="display: none;">
        <ul class="pagination justify-content-center"></ul>
    </nav>
</div>

<script>
let currentPage = 0;
const pageSize = 10;

async function loadTickets() {
    const status = document.getElementById('filter-status').value;
    const priority = document.getElementById('filter-priority').value;
    const technicalArea = document.getElementById('filter-technical-area').value;
    
    const params = new URLSearchParams({
        skip: currentPage * pageSize,
        limit: pageSize
    });
    
    if (status) params.append('status', status);
    if (priority) params.append('priority', priority);
    if (technicalArea) params.append('technical_area', technicalArea);
    
    try {
        const response = await fetch(`/api/tickets/?${params}`);
        const data = await response.json();
        
        displayTickets(data.tickets);
        updatePagination(data.total);
    } catch (error) {
        document.getElementById('tickets-container').innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle"></i> Failed to load tickets: ${error.message}
            </div>
        `;
    }
}

function displayTickets(tickets) {
    const container = document.getElementById('tickets-container');
    
    if (tickets.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5">
                <i class="bi bi-inbox display-1 text-muted"></i>
                <p class="text-muted mt-3">No tickets found</p>
                <a href="/upload" class="btn btn-primary">Create First Ticket</a>
            </div>
        `;
        return;
    }
    
    container.innerHTML = tickets.map(ticket => `
        <div class="card mb-3 shadow-sm ticket-card">
            <div class="card-body">
                <div class="ticket-card-meta">
                    <span class="ticket-number-badge">${ticket.ticket_number}</span>
                    <span class="text-muted" style="font-size:.75rem;">${new Date(ticket.created_at).toLocaleDateString()}</span>
                </div>
                <h5 class="card-title mb-2 mt-2">
                    <a href="/tickets/${ticket.ticket_number}" class="text-decoration-none" style="color:var(--text-primary);">
                        ${ticket.title}
                    </a>
                </h5>
                <div class="mb-2">
                    <span class="badge bg-${getPriorityColor(ticket.priority)}">${ticket.priority}</span>
                    <span class="badge bg-${getStatusColor(ticket.status)} ms-1">${ticket.status}</span>
                    ${ticket.technical_area ? `<span class="badge bg-secondary ms-1">${ticket.technical_area}</span>` : ''}
                </div>
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-2">
                    <p class="text-muted mb-0">
                        <small>${ticket.assigned_to ? `<i class="bi bi-person"></i> ${ticket.assigned_to}` : '<i class="bi bi-person-x"></i> Unassigned'}</small>
                    </p>
                    <button class="btn btn-sm btn-outline-danger" style="font-size:.72rem;padding:.2rem .6rem;border-radius:7px;" onclick="deleteTicket('${ticket.ticket_number}')" title="Delete ticket"><i class="bi bi-trash3"></i> Delete</button>
                </div>
            </div>
        </div>
    `).join('');
}

function getPriorityColor(priority) {
    const colors = {
        'low': 'success',
        'medium': 'info',
        'high': 'warning',
        'critical': 'danger'
    };
    return colors[priority] || 'secondary';
}

function getStatusColor(status) {
    const colors = {
        'open': 'secondary',
        'assigned': 'primary',
        'in_progress': 'warning',
        'resolved': 'success',
        'closed': 'dark'
    };
    return colors[status] || 'secondary';
}

async function deleteTicket(ticketNumber) {
    if (!confirm(`Delete ticket ${ticketNumber}?\nThis cannot be undone.`)) return;
    try {
        const res = await fetch(`/api/tickets/${ticketNumber}`, { method: 'DELETE' });
        if (!res.ok) { const e = await res.json(); throw new Error(e.detail || 'Delete failed'); }
        loadTickets();
    } catch(e) {
        alert('Error: ' + e.message);
    }
}

function updatePagination(total) {
    // Pagination logic here if needed
    const totalPages = Math.ceil(total / pageSize);
    document.getElementById('pagination-container').style.display = totalPages > 1 ? 'block' : 'none';
}

// Load tickets on page load
loadTickets();
</script>
</div><!-- /page-bg-wrap -->
{% endblock %}

{% block extra_js %}
<script>
(function(){
  const c=document.getElementById('tickets-canvas');if(!c)return;
  const ctx=c.getContext('2d');let W,H,pts=[];
  const N=90,CONN=155;
  function resize(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight;}
  function Pt(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.35;this.vy=(Math.random()-.5)*.35;this.r=Math.random()*1.4+.7;this.a=Math.random()*.45+.18;}
  Pt.prototype.move=function(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W)this.vx*=-1;if(this.y<0||this.y>H)this.vy*=-1;};
  function init(){resize();pts=Array.from({length:N},()=>new Pt());}
  function draw(){ctx.clearRect(0,0,W,H);for(let i=0;i<pts.length;i++){const p=pts[i];p.move();ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(129,140,248,'+p.a+')';ctx.fill();for(let j=i+1;j<pts.length;j++){const q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);if(d<CONN){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle='rgba(99,102,241,'+(0.13*(1-d/CONN))+')';ctx.lineWidth=.6;ctx.stroke();}}}requestAnimationFrame(draw);}
  window.addEventListener('resize',()=>{resize();pts.forEach(p=>{p.x=Math.random()*W;p.y=Math.random()*H;});},{passive:true});
  init();draw();
})();
</script>
{% endblock %}
