{% extends "base.html" %}

{% block title %}Developers - TechFixAI{% endblock %}

{% block content %}
<div class="container py-5">
    <!-- Enhanced Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-2 fw-bold">
                <i class="bi bi-people-fill" style="color: #8b5cf6;"></i> Development Team
            </h2>
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted">
                    <i class="bi bi-circle-fill text-success" style="font-size: 8px;"></i>
                    Online: <strong id="online-count-display">0/0</strong>
                </span>
            </div>
        </div>
        <div id="security-badge-container"></div>
    </div>

    <!-- Developer Cards Grid (2 columns) -->
    <div id="developers-container" class="row g-4">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-2">Loading developers...</p>
        </div>
    </div>

    <!-- Developer Details Modal -->
    <div class="modal fade" id="developerModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content dev-modal-content">
                <div class="modal-header dev-modal-header">
                    <h5 class="modal-title" id="modal-developer-name">Developer Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body dev-modal-body" id="modal-developer-details">
                    <!-- Details will be loaded here -->
                </div>
                <div class="modal-footer dev-modal-footer">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Close</button>
                    <a href="/upload" class="btn btn-primary-gradient">
                        <i class="bi bi-plus-circle"></i> Create Ticket
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/ui-components.js"></script>
<script>
let developersData = [];

async function loadDevelopers() {
    try {
        const response = await fetch('/api/developers/');
        const data = await response.json();
        
        developersData = data.developers || [];
        displayDevelopers(developersData);
        updateStats(data);
        renderSecurityBadge();
    } catch (error) {
        console.error('Failed to load developers:', error);
        document.getElementById('developers-container').innerHTML = `
            <div class="col-12">
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle"></i> Failed to load developers: ${error.message}
                </div>
            </div>
        `;
    }
}

function renderSecurityBadge() {
    const container = document.getElementById('security-badge-container');
    if (typeof createSecurityBadge === 'function') {
        container.innerHTML = createSecurityBadge();
    } else {
        container.innerHTML = `
            <div class="badge bg-dark border border-success px-3 py-2">
                <i class="bi bi-shield-check text-success"></i> Secure • AES-256-GCM
            </div>
        `;
    }
}

function displayDevelopers(developers) {
    const container = document.getElementById('developers-container');
    
    if (developers.length === 0) {
        container.innerHTML = `
            <div class="col-12 text-center py-5">
                <i class="bi bi-people display-1 text-muted"></i>
                <p class="text-muted mt-3">No developers available</p>
            </div>
        `;
        return;
    }
    
    // Enhanced 2-column layout with refined cards
    container.innerHTML = developers.map((dev, index) => `
        <div class="col-md-6">
            <div class="card h-100 shadow-sm hover-lift developer-card" style="cursor: pointer;" onclick="showDeveloperDetails(${index})">
                <div class="card-body p-4">
                    <!-- Card Header: Avatar, Name, Status -->
                    <div class="d-flex align-items-start gap-3 mb-3">
                        <div class="position-relative">
                            <div class="developer-avatar rounded-circle d-flex align-items-center justify-content-center text-white fw-bold"
                                 style="width: 64px; height: 64px; background: linear-gradient(135deg, #8b5cf6, #6d28d9); font-size: 1.5rem; flex-shrink: 0;">
                                ${dev.name.split(' ').map(n => n[0]).join('')}
                            </div>
                            <span class="position-absolute bottom-0 end-0 p-2 bg-${dev.status === 'online' ? 'success' : 'secondary'} border border-light rounded-circle ${dev.status === 'online' ? 'pulse' : ''}"
                                  style="width: 18px; height: 18px;">
                                <span class="visually-hidden">${dev.status}</span>
                            </span>
                        </div>
                        <div class="flex-grow-1">
                            <h5 class="mb-1 fw-bold">${dev.name}</h5>
                            <p class="mb-2 small text-muted">${dev.email}</p>
                            <div class="d-flex align-items-center gap-3 small text-muted">
                                <span>
                                    <i class="bi bi-clock-history"></i> ${dev.avg_response_time || '2-5 min'}
                                </span>
                                <span>
                                    <i class="bi bi-ticket-perforated"></i> ${dev.active_tickets || 0} active
                                </span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Expertise Section -->
                    <div class="mt-3 pt-3 border-top">
                        <p class="mb-2 small text-muted fw-semibold">EXPERTISE</p>
                        <div class="d-flex flex-wrap gap-2">
                            ${dev.expertise ? dev.expertise.split(',').map(exp => 
                                `<span class="badge rounded-pill" style="background: linear-gradient(135deg, #3b82f6, #2563eb); padding: 0.4rem 0.8rem;">${exp.trim()}</span>`
                            ).join('') : '<span class="text-muted small">Not specified</span>'}
                        </div>
                    </div>
                    
                    ${dev.languages ? `
                        <div class="mt-3">
                            <small class="text-muted">
                                <i class="bi bi-translate"></i> ${dev.languages}
                            </small>
                        </div>
                    ` : ''}
                </div>
            </div>
        </div>
    `).join('');
}

function updateStats(data) {
    const total = data.total || 0;
    const online = (data.developers || []).filter(d => d.status === 'online').length;
    document.getElementById('online-count-display').textContent = `${online}/${total}`;
}

function showDeveloperDetails(index) {
    const dev = developersData[index];
    if (!dev) return;
    
    document.getElementById('modal-developer-name').textContent = dev.name;
    document.getElementById('modal-developer-details').innerHTML = `
        <div class="dev-details-container">
            <!-- Avatar Section -->
            <div class="text-center mb-4 pb-3 border-bottom dev-border">
                <div class="dev-modal-avatar mx-auto mb-3">
                    ${dev.name.split(' ').map(n => n[0]).join('')}
                </div>
                <h5 class="fw-bold mb-1 text-white">${dev.name}</h5>
                <p class="text-muted mb-2 small">${dev.email}</p>
                <span class="badge ${dev.status === 'online' ? 'badge-online' : 'badge-offline'}">
                    <i class="bi bi-circle-fill me-1"></i>${dev.status === 'online' ? 'Online Now' : 'Offline'}
                </span>
            </div>
            
            <!-- Information Grid -->
            <div class="row g-3">
                <!-- Expertise Column -->
                <div class="col-12">
                    <div class="info-section">
                        <h6 class="section-title mb-3">
                            <i class="bi bi-star-fill text-warning me-2"></i>Expertise Areas:
                        </h6>
                        <div class="d-flex flex-wrap gap-2">
                            ${dev.expertise ? dev.expertise.split(',').map(exp => 
                                `<span class="badge-expertise">${exp.trim()}</span>`
                            ).join('') : '<span class="text-muted small">Not specified</span>'}
                        </div>
                    </div>
                </div>
                
                <!-- Languages Column -->
                ${dev.languages ? `
                    <div class="col-12">
                        <div class="info-section">
                            <h6 class="section-title mb-2">
                                <i class="bi bi-translate text-info me-2"></i>Languages:
                            </h6>
                            <p class="mb-0 text-light">${dev.languages}</p>
                        </div>
                    </div>
                ` : ''}
                
                <!-- Performance Metrics -->
                <div class="col-12">
                    <div class="info-section">
                        <h6 class="section-title mb-3">
                            <i class="bi bi-graph-up text-success me-2"></i>Performance Metrics:
                        </h6>
                        <div class="metrics-grid">
                            <div class="metric-item">
                                <div class="metric-icon">
                                    <i class="bi bi-clock"></i>
                                </div>
                                <div class="metric-content">
                                    <div class="metric-label">Avg Response</div>
                                    <div class="metric-value">${dev.avg_response_time || '2-5 min'}</div>
                                </div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-icon">
                                    <i class="bi bi-ticket-perforated"></i>
                                </div>
                                <div class="metric-content">
                                    <div class="metric-label">Active Tickets</div>
                                    <div class="metric-value">${dev.active_tickets || 0}</div>
                                </div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-icon">
                                    <i class="bi bi-check-circle"></i>
                                </div>
                                <div class="metric-content">
                                    <div class="metric-label">Resolved</div>
                                    <div class="metric-value">${dev.resolved_tickets || 0}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Joined Date -->
                ${dev.created_at ? `
                    <div class="col-12">
                        <div class="text-muted small">
                            <i class="bi bi-calendar-check"></i> Joined: ${new Date(dev.created_at).toLocaleDateString()}
                        </div>
                    </div>
                ` : ''}
            </div>
        </div>
    `;
    
    const modal = new bootstrap.Modal(document.getElementById('developerModal'));
    modal.show();
}

// Load developers on page load
loadDevelopers();
</script>

<style>
/* Developer Card Styling */
.developer-card {
    transition: all 0.3s ease;
    border: 1px solid rgba(59, 130, 246, 0.1);
}

.developer-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 30px rgba(139, 92, 246, 0.2) !important;
    border-color: rgba(139, 92, 246, 0.3);
}

.developer-avatar {
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
}

.hover-lift {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.pulse {
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.5;
    }
}

/* Enhanced badge styling */
#security-badge-container .badge {
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.02em;
}

/* ===== MODAL STYLING ===== */

/* Modal Dialog - Viewport Constrained */
.modal-dialog {
    max-height: calc(100vh - 60px);
}

/* Modal Content - Glassmorphism Effect */
.dev-modal-content {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 1.25rem;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

/* Modal Header */
.dev-modal-header {
    background: rgba(59, 130, 246, 0.12);
    border-bottom: 1px solid rgba(59, 130, 246, 0.2);
    padding: 1.5rem;
    backdrop-filter: blur(10px);
}

.dev-modal-header .modal-title {
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.5px;
}

/* Modal Body - Scrollable */
.dev-modal-body {
    padding: 2rem;
    max-height: calc(100vh - 280px);
    overflow-y: auto;
    overflow-x: hidden;
}

/* Custom Scrollbar */
.dev-modal-body::-webkit-scrollbar {
    width: 8px;
}

.dev-modal-body::-webkit-scrollbar-track {
    background: rgba(59, 130, 246, 0.1);
    border-radius: 10px;
}

.dev-modal-body::-webkit-scrollbar-thumb {
    background: rgba(59, 130, 246, 0.3);
    border-radius: 10px;
}

.dev-modal-body::-webkit-scrollbar-thumb:hover {
    background: rgba(59, 130, 246, 0.5);
}

/* Modal Footer */
.dev-modal-footer {
    background: rgba(15, 23, 42, 0.6);
    border-top: 1px solid rgba(59, 130, 246, 0.2);
    padding: 1.5rem;
    backdrop-filter: blur(10px);
}

/* Details Container */
.dev-details-container {
    color: #e0e7ff;
}

/* Avatar Circle */
.dev-modal-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    font-weight: 700;
    font-size: 2.5rem;
    box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
}

/* Border styling */
.dev-border {
    border-color: rgba(59, 130, 246, 0.2) !important;
}

/* Info Sections */
.info-section {
    background: rgba(51, 65, 85, 0.3);
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-radius: 0.75rem;
    padding: 1.25rem;
    transition: all 0.3s ease;
}

.info-section:hover {
    background: rgba(51, 65, 85, 0.5);
    border-color: rgba(59, 130, 246, 0.4);
}

/* Section Title */
.section-title {
    color: #f1f5f9;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    margin: 0;
}

/* Expertise Badges */
.badge-expertise {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    font-size: 0.85rem;
    font-weight: 500;
    display: inline-block;
    transition: all 0.3s ease;
}

.badge-expertise:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

/* Status Badges */
.badge-online {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    padding: 0.4rem 1rem;
    border-radius: 0.5rem;
    font-size: 0.85rem;
    font-weight: 500;
}

.badge-offline {
    background: linear-gradient(135deg, #6b7280, #4b5563);
    color: white;
    padding: 0.4rem 1rem;
    border-radius: 0.5rem;
    font-size: 0.85rem;
    font-weight: 500;
}

/* Metrics Grid */
.metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1rem;
}

/* Metric Item */
.metric-item {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.05));
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-radius: 0.75rem;
    padding: 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    transition: all 0.3s ease;
}

.metric-item:hover {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.1));
    border-color: rgba(59, 130, 246, 0.4);
    transform: translateY(-2px);
}

/* Metric Icon */
.metric-icon {
    font-size: 1.5rem;
    color: #60a5fa;
    min-width: 32px;
    text-align: center;
}

/* Metric Content */
.metric-content {
    flex: 1;
}

.metric-label {
    font-size: 0.75rem;
    color: #94a3b8;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}

.metric-value {
    font-size: 1.25rem;
    font-weight: 700;
    color: #f1f5f9;
}

/* Buttons */
.btn-primary-gradient {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border: none;
    color: white;
    font-weight: 600;
    padding: 0.5rem 1.5rem;
    transition: all 0.3s ease;
}

.btn-primary-gradient:hover {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    color: white;
}

/* Close Button */
.btn-close-white {
    filter: brightness(0.8);
}

.btn-close-white:focus {
    box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.25);
}

/* Outline Button */
.btn-outline-light {
    color: #e0e7ff;
    border-color: rgba(224, 231, 255, 0.3);
    transition: all 0.3s ease;
}

.btn-outline-light:hover {
    background: rgba(224, 231, 255, 0.1);
    border-color: rgba(224, 231, 255, 0.6);
    color: #fff;
}

/* Modal Backdrop */
.modal-backdrop {
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
}

/* Prevent body scroll when modal is open */
body.modal-open {
    overflow: hidden;
}
</style>
{% endblock %}
